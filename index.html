<script>
    /* RELOJ */
    function updateClock() {
        var now = new Date();
        document.getElementById('clock').innerHTML = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* NAVEGACIÓN */
    function toggleMain(id) {
        var menu = document.getElementById(id);
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }
    function toggleSub(id) {
        var sub = document.getElementById(id);
        sub.style.display = (sub.style.display === "block") ? "none" : "block";
    }

    /* CONTROL PS3/TV */
    var navIndex = -1;
    function getVisibleNav() { return document.querySelectorAll('.nav-item'); }
    
    document.addEventListener('keydown', function(e) {
        var items = getVisibleNav();
        if (e.keyCode === 40 || e.keyCode === 39) navIndex = (navIndex + 1) % items.length;
        else if (e.keyCode === 38 || e.keyCode === 37) navIndex = (navIndex - 1 + items.length) % items.length;
        else if (e.keyCode === 13) items[navIndex].click();
        
        items.forEach(i => i.classList.remove('ps3-focus'));
        items[navIndex].classList.add('ps3-focus');
        items[navIndex].focus();
    });
</script>
